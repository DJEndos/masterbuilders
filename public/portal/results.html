<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Results — Masterbuilder International School</title>
<link rel="stylesheet" href="/public/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<div class="topbar">
  <div class="brand">
    <img src="/assets/logo.jpg" alt="logo" />
    <div><h1>Masterbuilder International School</h1><span>...Assuring Success</span></div>
  </div>
  <div class="user-info">
    <span id="studentLabel"></span>
    <button class="logout" onclick="logoutPortal()">Exit</button>
  </div>
</div>

<div class="container">
  <div class="card">
    <h2><i class="fa-solid fa-file-lines"></i> Published Results</h2>
    <div id="alertBox"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Session</th><th>Term</th><th>Class</th><th>Average</th><th>Position</th><th>Action</th></tr>
        </thead>
        <tbody id="resultsBody"><tr><td colspan="6">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/public/js/api.js"></script>
<script>
const studentID = sessionStorage.getItem('mis_portal_id');
const accessPIN = sessionStorage.getItem('mis_portal_pin');
const student = JSON.parse(sessionStorage.getItem('mis_portal_student') || 'null');

if (!studentID || !accessPIN || !student) {
  window.location.href = '/portal/login.html';
}

document.getElementById('studentLabel').textContent = `${student.fullName} (${student.studentID}) — ${student.class}`;

function logoutPortal() {
  sessionStorage.removeItem('mis_portal_id');
  sessionStorage.removeItem('mis_portal_pin');
  sessionStorage.removeItem('mis_portal_student');
  window.location.href = '/index.html';
}

async function loadResults() {
  const alertBox = document.getElementById('alertBox');
  const tbody = document.getElementById('resultsBody');
  try {
    const res = await fetch('/api/portal/results', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ studentID, accessPIN })
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || 'Could not load results.');

    if (!data.results.length) {
      tbody.innerHTML = '<tr><td colspan="6">No published results are available yet. Please check back later or contact the school office.</td></tr>';
      return;
    }

    tbody.innerHTML = data.results.map(r => `
      <tr>
        <td>${escapeHtml(r.session)}</td>
        <td>${escapeHtml(r.term)} Term</td>
        <td>${escapeHtml(r.class)}</td>
        <td>${r.averageScore}%</td>
        <td>${escapeHtml(r.position || '—')}</td>
        <td><button class="btn sm" onclick="downloadPDF('${r.id}')"><i class="fa-solid fa-download"></i> Download PDF</button></td>
      </tr>
    `).join('');
  } catch (err) {
    showAlert(alertBox, err.message);
    tbody.innerHTML = '';
  }
}

async function downloadPDF(resultId) {
  const alertBox = document.getElementById('alertBox');
  try {
    const res = await fetch(`/api/portal/result/${resultId}/pdf`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ studentID, accessPIN })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.message || 'Could not download result PDF.');
    }
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${student.studentID}_Result.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
  } catch (err) {
    showAlert(alertBox, err.message);
  }
}

loadResults();
</script>
</body>
</html>
