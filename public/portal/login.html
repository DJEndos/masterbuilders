<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Check Result — Masterbuilder International School</title>
<link rel="stylesheet" href="/public/css/style.css" />
</head>
<body>
<div class="topbar">
  <div class="brand">
    <img src="/public/assets/logo.jpg" alt="logo" />
    <div><h1>Masterbuilder International School</h1><span>...Assuring Success</span></div>
  </div>
  <a href="/public/index.html" style="color:#fff;font-size:13px;">&larr; Back home</a>
</div>

<div class="container">
  <div class="login-box card">
    <h2>👨‍👩‍👧 Check Student Result</h2>
    <p class="small-muted" style="margin-top:-6px;">Enter the Student ID and confidential PIN issued by the school to view results.</p>
    <div id="alertBox"></div>
    <form id="loginForm">
      <label>Student ID</label>
      <input type="text" id="studentID" required placeholder="e.g. MIS/2026/0001" style="text-transform:uppercase;" />
      <label>Access PIN</label>
      <input type="password" id="accessPIN" required placeholder="6-digit PIN" inputmode="numeric" maxlength="6" />
      <button type="submit" class="btn outline" style="width:100%;margin-top:20px;" id="submitBtn">View Results</button>
    </form>
    <p class="small-muted">Lost your PIN? Contact the school office to have it reset by the administrator.</p>
  </div>
</div>

<script src="/public/js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('alertBox');
  const btn = document.getElementById('submitBtn');
  const studentID = document.getElementById('studentID').value.trim().toUpperCase();
  const accessPIN = document.getElementById('accessPIN').value.trim();
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Verifying...';
  try {
    const data = await apiRequest('/portal/verify', {
      method: 'POST', auth: false, body: { studentID, accessPIN }
    });
    // Store credentials only in sessionStorage (cleared when tab closes) — never persisted long-term
    sessionStorage.setItem('mis_portal_id', studentID);
    sessionStorage.setItem('mis_portal_pin', accessPIN);
    sessionStorage.setItem('mis_portal_student', JSON.stringify(data.student));
    window.location.href = '/portal/results.html';
  } catch (err) {
    showAlert(alertBox, err.message);
    btn.disabled = false; btn.innerHTML = 'View Results';
  }
});
</script>
</body>
</html>
